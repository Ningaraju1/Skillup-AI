name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Frontend Build & Verification
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend (React + Vite) CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────
  # JOB 2: Backend (Django + Python) CI
  # ─────────────────────────────────────────────
  backend-ci:
    name: Backend (Django) System Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock-key-for-ci' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-ci-secret-key' }}
        run: |
          python manage.py check

      - name: Run Django Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock-key-for-ci' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-ci-secret-key' }}
        run: |
          python manage.py test

  # ─────────────────────────────────────────────
  # JOB 3: Docker Container Build Verification
  # ─────────────────────────────────────────────
  docker-ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skillup-ai:latest
